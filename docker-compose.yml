# Second Watch Party sync server, in Docker (alongside the systemd one on :4000).
# Host port 4001 -> container 4000 to avoid clashing with the existing server.
#
# Deploy via Portainer (Stacks -> Add stack -> Repository, pointing at this repo)
# or with:  JOIN_SECRET=yourpass docker compose up -d --build
services:
  watchparty:
    build: ./server
    container_name: watchparty-docker
    restart: unless-stopped
    ports:
      - "4001:4000"
    environment:
      # Set JOIN_SECRET in Portainer's env / a .env file. Falls back to changeme.
      - JOIN_SECRET=${JOIN_SECRET:-changeme}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Cloudflare Quick Tunnel giving the Docker server a public HTTPS URL.
  # Reaches the server over the internal compose network (no host port needed).
  # The random *.trycloudflare.com URL appears in this container's logs and
  # changes on every restart. Grab it with:
  #   docker logs watchparty-tunnel-docker 2>&1 | grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' | tail -1
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: watchparty-tunnel-docker
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://watchparty:4000
    depends_on:
      - watchparty
