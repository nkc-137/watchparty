<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 14px;
        font-family: Helvetica, Arial, sans-serif;
        font-size: 13px;
        background: #141414;
        color: #eee;
      }
      h1 { font-size: 15px; margin: 0 0 10px; color: #e50914; }
      label { display: block; margin: 8px 0 3px; font-size: 11px; opacity: 0.8; }
      input {
        width: 100%; box-sizing: border-box; padding: 7px;
        border-radius: 5px; border: 1px solid #333; background: #222; color: #fff;
      }
      .row { display: flex; gap: 8px; margin-top: 12px; }
      button {
        flex: 1; padding: 8px; border: none; border-radius: 5px;
        cursor: pointer; font-weight: 600;
      }
      #join { background: #e50914; color: #fff; }
      #leave { background: #333; color: #fff; }
      #toggle-row {
        display: flex; align-items: center; justify-content: space-between;
        gap: 10px; margin-top: 12px; font-size: 12px; cursor: pointer; opacity: 0.9;
      }
      .switch { position: relative; display: inline-block; width: 38px; height: 22px; flex: none; }
      .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
      .slider {
        position: absolute; inset: 0; background: #555;
        border-radius: 999px; transition: background 0.15s;
      }
      .slider::before {
        content: ""; position: absolute; height: 16px; width: 16px;
        left: 3px; top: 3px; background: #fff; border-radius: 50%;
        transition: transform 0.15s;
      }
      .switch input:checked + .slider { background: #e50914; }
      .switch input:checked + .slider::before { transform: translateX(16px); }
      #msg { margin-top: 10px; font-size: 11px; min-height: 14px; opacity: 0.85; }
      .hint { font-size: 10px; opacity: 0.5; margin-top: 2px; }
    </style>
  </head>
  <body>
    <h1>Watch Party</h1>
    <label>Server URL</label>
    <input id="serverUrl" placeholder="https://party.example.com" />
    <label>Room code</label>
    <input id="roomCode" placeholder="movie-night" />
    <label>Your name</label>
    <input id="name" placeholder="alex" />
    <label>Secret (optional)</label>
    <input id="secret" type="password" placeholder="shared password" />
    <div class="row">
      <button id="join">Join</button>
      <button id="leave">Leave</button>
    </div>
    <div class="row">
      <button id="copy">Copy invite</button>
      <button id="paste">Paste invite</button>
    </div>
    <label id="toggle-row" for="showPanel">
      <span>Show chat overlay on the video</span>
      <span class="switch">
        <input id="showPanel" type="checkbox" checked />
        <span class="slider"></span>
      </span>
    </label>
    <div id="msg"></div>
    <div class="hint">Open a title on Netflix, Prime Video, YouTube, Tubi, or Pluto TV, then Join. Everyone must be on the same title.</div>
    <script src="popup.js"></script>
  </body>
</html>
